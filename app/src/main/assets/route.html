<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  .msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
         font: 14px sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="msg" id="msg"></div>
<script src="maplibre-gl.js"></script>
<script>
  // The app calls init(theme) once, then setStops(list) for one package's route, or
  // setPackages(list) for the home overview of every package on the way.
  // theme: { interactive, bg, land, water, road, major, building, boundary, label, accent, past }
  var map = null, ready = false, pending = null, T = null;

  function init(theme) {
    T = theme;
    document.body.style.background = T.bg;
    document.getElementById('msg').style.color = T.label;
    try {
      map = new maplibregl.Map({
        container: 'map',
        // Positron is OpenFreeMap's simplest vector style; every color is then repainted to match the app.
        style: 'https://tiles.openfreemap.org/styles/positron',
        center: [-96, 39], zoom: 3, maxZoom: 15,
        interactive: !!T.interactive,
        dragRotate: false, pitchWithRotate: false, fadeDuration: 0,
        attributionControl: T.interactive ? { compact: true } : false
      });
    } catch (e) { showMsg('This phone could not start the map (' + e.message + ').'); return; }
    if (T.interactive) map.touchZoomRotate.disableRotation();
    map.on('load', function () {
      ready = true;
      repaint();
      addRouteLayers();
      if (pending) { var p = pending; pending = null; p(); }
    });
    window.addEventListener('resize', function () { map.resize(); });
    setTimeout(function () { if (!ready) showMsg("Couldn't load the map. Check your connection."); }, 15000);
  }

  function showMsg(t) { var m = document.getElementById('msg'); m.textContent = t; m.style.display = 'flex'; }

  function set(id, prop, val) { try { map.setPaintProperty(id, prop, val); } catch (e) { /* layer lacks it */ } }

  // Repaint the base map in the app's theme colors so it sits naturally in light, dark, AMOLED or custom themes.
  function repaint() {
    (map.getStyle().layers || []).forEach(function (l) {
      var id = l.id;
      if (l.type === 'background') set(id, 'background-color', T.bg);
      else if (l.type === 'fill') {
        if (/water/.test(id)) set(id, 'fill-color', T.water);
        else if (/building/.test(id)) set(id, 'fill-color', T.building);
        else { set(id, 'fill-color', T.land); set(id, 'fill-outline-color', T.land); }
      } else if (l.type === 'line') {
        if (/water|river|stream|canal/.test(id)) set(id, 'line-color', T.water);
        else if (/boundary|admin/.test(id)) set(id, 'line-color', T.boundary);
        else if (/casing/.test(id)) set(id, 'line-color', T.bg);
        else if (/motorway|trunk|major|primary/.test(id)) set(id, 'line-color', T.major);
        else set(id, 'line-color', T.road);
      } else if (l.type === 'symbol') {
        set(id, 'text-color', T.label);
        set(id, 'text-halo-color', T.bg);
        set(id, 'icon-opacity', 0.6);
      }
    });
  }

  function addRouteLayers() {
    map.addSource('pkgs', { type: 'geojson', data: empty() });
    map.addSource('route', { type: 'geojson', data: empty() });
    map.addSource('stops', { type: 'geojson', data: empty() });
    map.addSource('ahead', { type: 'geojson', data: empty() });
    map.addSource('dest', { type: 'geojson', data: empty() });
    // Still to go: a dotted curve from where the package is now to the delivery address.
    map.addLayer({ id: 'ahead-line', type: 'line', source: 'ahead',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': T.accent, 'line-width': 3.5, 'line-opacity': 0.45, 'line-dasharray': [0.1, 2.2] } });
    map.addLayer({ id: 'dest-ring', type: 'circle', source: 'dest',
      paint: { 'circle-radius': 7, 'circle-color': T.bg, 'circle-stroke-color': T.accent, 'circle-stroke-width': 3 } });
    // Where it's been: dotted curves joining each earlier stop, in the status color.
    map.addLayer({ id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': T.accent, 'line-width': 4.5, 'line-opacity': 0.95, 'line-dasharray': [0.1, 1.8] } });
    map.addLayer({ id: 'stop-past', type: 'circle', source: 'stops', filter: ['!=', ['get', 'latest'], true],
      paint: { 'circle-radius': 6, 'circle-color': T.past, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2 } });
    map.addLayer({ id: 'stop-halo', type: 'circle', source: 'stops', filter: ['==', ['get', 'latest'], true],
      paint: { 'circle-radius': 18, 'circle-color': T.accent, 'circle-opacity': 0.22 } });
    map.addLayer({ id: 'stop-now', type: 'circle', source: 'stops', filter: ['==', ['get', 'latest'], true],
      paint: { 'circle-radius': 8, 'circle-color': T.accent, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 3 } });

    // Home overview: one dot per package in its status color, with its name underneath.
    map.addLayer({ id: 'pkg-halo', type: 'circle', source: 'pkgs',
      paint: { 'circle-radius': 15, 'circle-color': ['get', 'color'], 'circle-opacity': 0.22 } });
    map.addLayer({ id: 'pkg-dot', type: 'circle', source: 'pkgs',
      paint: { 'circle-radius': 7, 'circle-color': ['get', 'color'], 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2.5 } });
    map.addLayer({ id: 'pkg-label', type: 'symbol', source: 'pkgs',
      layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'], 'text-size': 11,
                'text-offset': [0, 1.5], 'text-anchor': 'top', 'text-max-width': 9, 'text-optional': true },
      paint: { 'text-color': T.label, 'text-halo-color': T.bg, 'text-halo-width': 1.5 } });
    if (T.interactive) {
      map.on('click', 'pkg-halo', function (e) {
        var f = e.features && e.features[0];
        if (f && window.ShipmentsMap) window.ShipmentsMap.open(f.properties.id);
      });
      map.on('mouseenter', 'pkg-halo', function () { map.getCanvas().style.cursor = 'pointer'; });
    }
  }

  // Fit the camera to the points, zooming out only as far as needed to show them all.
  function fit(coords, singleZoom) {
    if (coords.length === 1) {
      map.jumpTo({ center: coords[0], zoom: singleZoom });
    } else if (coords.length > 1) {
      var b = new maplibregl.LngLatBounds(coords[0], coords[0]);
      coords.forEach(function (c) { b.extend(c); });
      map.fitBounds(b, { padding: T.interactive ? 72 : 44, maxZoom: 11, duration: 0 });
    }
  }

  // pkgs: [{ id, lat, lon, color, name }]
  function setPackages(pkgs) {
    if (!ready) { pending = function () { setPackages(pkgs); }; return; }
    map.getSource('pkgs').setData({ type: 'FeatureCollection', features: pkgs.map(function (p) {
      return { type: 'Feature', properties: { id: p.id, color: p.color, name: p.name },
               geometry: { type: 'Point', coordinates: [p.lon, p.lat] } };
    }) });
    fit(pkgs.map(function (p) { return [p.lon, p.lat]; }), 9);
  }

  function empty() { return { type: 'FeatureCollection', features: [] }; }

  // A gentle arc from a to b ([lon, lat]): a quadratic curve whose midpoint is pushed sideways
  // by a fraction of the leg's length. Always bends the same way so a route reads as one path.
  function arc(a, b, bend) {
    var dx = b[0] - a[0], dy = b[1] - a[1];
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1e-6) return [a, b];
    var cx = (a[0] + b[0]) / 2 - dy * bend, cy = (a[1] + b[1]) / 2 + dx * bend;
    var pts = [], n = 40;
    for (var i = 0; i <= n; i++) {
      var t = i / n, u = 1 - t;
      pts.push([u * u * a[0] + 2 * u * t * cx + t * t * b[0], u * u * a[1] + 2 * u * t * cy + t * t * b[1]]);
    }
    return pts;
  }

  function line(c) { return { type: 'Feature', geometry: { type: 'LineString', coordinates: c } }; }

  // stops: [{ lat, lon }] oldest first; the last one is where the package is now.
  // dest: { lat, lon } delivery address, or null when there's nothing left to go.
  function setStops(stops, dest) {
    if (!ready) { pending = function () { setStops(stops, dest); }; return; }
    var coords = stops.map(function (s) { return [s.lon, s.lat]; });
    var path = [];
    for (var i = 1; i < coords.length; i++) {
      var leg = arc(coords[i - 1], coords[i], 0.18);
      path = path.concat(i === 1 ? leg : leg.slice(1));
    }
    map.getSource('route').setData(path.length > 1 ? line(path) : empty());
    var d = dest ? [dest.lon, dest.lat] : null;
    var last = coords[coords.length - 1];
    var toGo = d && last && (Math.abs(d[0] - last[0]) + Math.abs(d[1] - last[1]) > 0.01);
    map.getSource('ahead').setData(toGo ? line(arc(last, d, 0.18)) : empty());
    map.getSource('dest').setData(toGo ? { type: 'Feature', geometry: { type: 'Point', coordinates: d } } : empty());
    // Small preview on the package page: just the latest leg (previous stop to where it is now).
    // Full-screen map: everywhere it has been, plus the delivery address.
    var view = T.interactive ? (toGo ? coords.concat([d]) : coords) : coords.slice(-2);
    map.getSource('stops').setData({ type: 'FeatureCollection', features: coords.map(function (c, i) {
      return { type: 'Feature', properties: { latest: i === coords.length - 1 }, geometry: { type: 'Point', coordinates: c } };
    }) });
    fit(view, 10);
  }
</script>
</body>
</html>
